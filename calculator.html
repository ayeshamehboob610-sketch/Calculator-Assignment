<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 300px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            font-size: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="First number">

        <input type="number" id="num2" placeholder="Second number">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
        </div>

        <div id="result">Result: </div>
    </div>

    <script>
        function calculate(operation) {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let result;

            if (operation === "+") {
                result = num1 + num2;
            } 
            else if (operation === "-") {
                result = num1 - num2;
            } 
            else if (operation === "*") {
                result = num1 * num2;
            } 
            else if (operation === "/") {
                if (num2 === 0) {
                    result = "Cannot divide by zero";
                } else {
                    result = num1 / num2;
                }
            }

            document.getElementById("result").innerText = "Result: " + result;
        }
    </script>

</body>
</html>
